deployment:
  start: null
  location:
    latitude: null
    longitude: null
    accuracy: null
  setting: null
  distance: null
  notes: null
camera:
  mode: mono
  fps: 15
  image:
    resolution: 4k
    quality: 80
  resolution_mono:
    width: 800
    height: 448
  zoom:
    enabled: false
    factor: 1.0
  focus:
    mode: manual
    type: lens_pos
    manual:
      lens_pos: 128
      distance: 19
    range:
      lens_pos:
        min: 154
        max: 165
      distance:
        min: 15
        max: 20
  exposure:
    mode: manual
    time: 3.2
    iso: 300
  isp:
    sharpness: 1
    luma_denoise: 1
    chroma_denoise: 1
detection:
  model: platform_insect-detect-tiled_v2-0-0.tar.xz
  model_night: platform_insect-detect-tiled_v2-0-0.tar.xz
  resolution:
    width: 800
    height: 448
  num_shaves: 4
  conf_threshold: 0.3
  ae_region:
    enabled: false
tracking:
  type: SHORT_TERM_IMAGELESS
  occlusion_ratio_threshold: 0.5
  tracklet_birth_threshold: 15
  tracklet_max_lifespan: 60
  filter_stale_tracklets: true
recording:
  duration:
    battery:
      high: 60
      medium: 40
      low: 20
    default: 40
  interval:
    detection: 2.0
    burst_duration: 5.0
    timelapse: 5.0
    timelapse_night: 10.0
  shutdown:
    enabled: false
processing:
  crop:
    enabled: false
    method: square
  overlay:
    enabled: false
  delete:
    enabled: false
webapp:
  resolution:
    width: 800
    height: 448
  resolution_mono:
    width: 800
    height: 448
  stream:
    quality: 70
  https:
    enabled: false
network:
  mode: wifi
  hotspot:
    ssid: null
    password: null
  wifi:
  - ssid: null
    password: null
powermanager:
  enabled: true
  model: wittypi
  charge_min: 30
  charge_check: 30
oak:
  temp_max: 100
  temp_check: 30
led:
  enabled: false
  gpio_pin: 18
metrics:
  enabled: false
  interval: 30
storage:
  disk_min: 1000
  disk_check: 60
  archive:
    enabled: false
    disk_low: 5000
  upload:
    enabled: false
    content: crops
startup:
  hotspot_setup:
    enabled: true
  network_setup:
    enabled: true
  auto_run:
    enabled: false
    primary: capture
    fallback: null
    delay: 180
night:
  ir_intensity: 0.1
  led_brightness: 80
