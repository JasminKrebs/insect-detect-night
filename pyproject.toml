[project]
name = "insect-detect"
version = "2.0.0"
description = "Software for automated insect monitoring with the Insect Detect camera trap."
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E.*"]
readme = "README.md"
authors = [{name = "Maximilian Sittinger"}]
dependencies = [
    "depthai >=3.7.1,<4",
    "gpiozero >=2.0.1,<3",
    "nicegui >=3.13.0,<4",
    "nmcli >=1.8.0,<2",
    "numpy >=2.5.0,<3",
    "opencv-python-headless >=4.13.0.92,<5",
    "polars >=1.41.2,<2",
    "psutil >=7.2.2,<8",
    "pydantic >=2.13.4,<3",
    "pyyaml >=6.0.3,<7",
    "rpi_ws281x >=5.0.0,<6",
    "adafruit-circuitpython-tsl2591 >=1.4.2,<2",
    "smbus2 >=0.6.1,<1",
]

[project.scripts]
startup = "insectdetect.startup:main"
capture = "insectdetect.capture:main"
webapp = "insectdetect.webapp:main"
capture_day = "insectdetect.capture_day:main"
capture_night = "insectdetect.capture_night:main"

[project.urls]
Documentation = "https://maxsitt.github.io/insect-detect-docs/"
Repository = "https://github.com/maxsitt/insect-detect"
Issues = "https://github.com/maxsitt/insect-detect/issues"

[tool.uv]
package = true

[tool.pylint.typecheck]
ignored-modules = ["cv2"]